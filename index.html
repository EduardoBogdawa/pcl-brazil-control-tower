<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nexteer-logo.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Control Tower PC&amp;L Brasil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <script>
      // Applied before first paint so the saved theme never flashes the wrong colors.
      try {
        var t = localStorage.getItem('ct-theme');
        // The Nexteer palette is layered on top of the light theme.
        if (t === 'light' || t === 'nexteer') document.documentElement.dataset.theme = 'light';
        if (t === 'nexteer') document.documentElement.dataset.palette = 'nexteer';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Public runtime settings; must load before the app so Supabase and MSAL see them at startup. -->
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
