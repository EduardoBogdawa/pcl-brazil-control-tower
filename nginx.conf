server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Every location must include the shared security headers (add_header is not inherited once a location sets its own).
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Generated at container start outside the web root; must never be cached so new settings apply on restart.
  location = /runtime-config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    alias /usr/share/nginx/runtime/runtime-config.js;
    default_type application/javascript;
  }

  # index.html must never be cached so new builds are picked up immediately.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
