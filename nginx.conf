server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # add_header in a location replaces server-level headers, so the shared set lives in each location.
  location /assets/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Generated at container start outside the web root; must never be cached so new settings apply on restart.
  location = /runtime-config.js {
    alias /usr/share/nginx/runtime/runtime-config.js;
    default_type application/javascript;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
  }

  # index.html must never be cached so new builds are picked up immediately.
  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
